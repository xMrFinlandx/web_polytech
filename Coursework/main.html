<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <div class="header-left">
            <img class="logo-image" src="../icons/icon_empty.png"></img>
            <h1 class="logo">World Graph Editor</h1>
        </div>

        <nav class="header-right">
            <div class="dropdown">
                <button class="dropdown-btn">Работы ▾</button>
                <div class="dropdown-content">
                    <a href="../index.html">1 работа</a>
                    <a href="../Work2/work2.html">2 работа</a>
                    <a href="../Work3/work3.html">3 работа</a>
                    <a href="../Work4/work4.html">4 работа</a>
                    <a href="../Work5/work5.html">5 работа</a>
                    <a href="../Coursework/main.html">Курсовая работа</a>
                </div>
            </div>
        </nav>
    </div>
</header>

<main>
    <section class="work-container">
        <div class="main-container">

            <h1>Тренажёр по электрическим схемам</h1>

            <div class="auth-block">
                <label>Введите имя:</label>
                <input type="text" id="playerName" placeholder="Ваше имя">
            </div>

            <h2>Выберите игру:</h2>

            <div class="games">
                <button class="menu-btn game-btn" data-game="1">
                    Собери цепь
                </button>

                <button class="menu-btn game-btn" data-game="2">
                    Найди ошибку
                </button>

                <button class="menu-btn game-btn" data-game="3">
                    Расчёт параметров
                </button>

                <button id="ratingBtn" class="menu-btn rating-btn">
                    Рекорды
                </button>
            </div>

        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 World Graph Editor</p>
    </div>
</footer>

<script src="main.js"></script>

</body>
</html>
